spring.application.name=quizduel-backend

# Port 5000 so the React app's default API URL (http://localhost:5000/api) works unchanged
server.port=5000

# ---- Database: H2, stored in ./data/quizduel.mv.db (created automatically) ----
spring.datasource.url=jdbc:h2:file:./data/quizduel
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---- App settings (override with environment variables) ----
# Use a long random value in real deployments
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
# Comma-separated list of allowed frontend origins
app.client-origin=${CLIENT_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
# "Today" for daily battles is calculated in this time zone
app.timezone=${APP_TIMEZONE:Asia/Manila}
# Insert the demo teacher/students/questions on first start
app.seed-demo-data=${SEED_DEMO_DATA:true}
